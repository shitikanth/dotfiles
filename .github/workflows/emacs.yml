name: emacs

on:
  push:
    paths:
      - '_emacs.d.old/**.el'
      - 'ci/**'
      - '.github/workflows/emacs.yml'
  pull_request:
    paths:
      - '_emacs.d.old/**.el'
      - 'ci/**'
      - '.github/workflows/emacs.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: git submodule update --init _emacs.d.old/lib/swiper
      - uses: purcell/setup-emacs@master
        with:
          version: 31.1
      - run: ln -s "$PWD/_emacs.d.old" ~/.emacs.d
      - uses: actions/cache@v6
        with:
          path: ~/.emacs.d/elpa
          key: elpa-31.1-${{ hashFiles('_emacs.d.old/init.el') }}
          restore-keys: elpa-31.1-
      - run: ci/test-startup
      - run: ci/byte-compile
